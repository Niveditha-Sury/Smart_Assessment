{% extends 'base.html' %}

{% block content %}
<style>
    /* Reuse your established theme styles */
    .display-greeting { font-weight: 800; letter-spacing: -1px; color: #212529; }
    .text-gradient {
        background: linear-gradient(45deg, #0d6efd, #004bb5);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
    }

    /* Enhanced Interactive Card */
    .category-card {
        transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        border-radius: 24px;
        border: 1px solid rgba(0,0,0,0.08);
        background: #ffffff;
        position: relative;
        overflow: hidden;
    }

    /* The Secret Sauce: Entire card is clickable without breaking layout */
    .category-link {
        text-decoration: none !important;
        color: inherit !important;
    }

    .category-link:hover .category-card {
        transform: translateY(-12px);
        box-shadow: 0 20px 40px rgba(13, 110, 253, 0.12) !important;
        border-color: #0d6efd;
    }

    /* Icon Animation */
    .icon-circle {
        width: 80px;
        height: 80px;
        background: rgba(13, 110, 253, 0.05);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 1.5rem;
        transition: all 0.3s ease;
        color: #6c757d;
    }

    .category-link:hover .icon-circle {
        background: #0d6efd;
        color: #ffffff;
        transform: rotate(-10deg) scale(1.1);
    }

    /* Subtle Background Pattern */
    .category-card::after {
        content: "";
        position: absolute;
        top: -50%;
        right: -50%;
        width: 100%;
        height: 100%;
        background: radial-gradient(circle, rgba(13, 110, 253, 0.03) 0%, transparent 70%);
        border-radius: 50%;
        transition: all 0.5s ease;
    }

    .category-link:hover .category-card::after {
        top: -20%;
        right: -20%;
    }
</style>

<div class="container py-5 mt-4">
    <div class="text-center mb-5">
        <h1 class="display-greeting">Choose Your <span class="text-gradient">Battlefield</span></h1>
        <p class="lead text-muted">Select a category to reveal specific subjects.</p>
    </div>

    <div class="row g-4 justify-content-center">
        {% for category in categories %}
        <div class="col-md-4">
            <a href="{% url 'subcategories' category.id %}" class="category-link">
                <div class="card p-5 shadow-sm category-card h-100 text-center">
                    <div class="icon-circle">
                        <i class="bi bi-rocket-takeoff" style="font-size: 2.2rem;"></i>
                    </div>
                    
                    <h3 class="fw-bold mb-2">{{ category.name }}</h3>
                    <p class="text-muted px-3">Explore specialized quizzes and track your performance in {{ category.name }}.</p>
                    
                    <div class="mt-4">
                        <span class="btn-dynamic">View Subjects</span>
                    </div>
                </div>
            </a>
        </div>
        {% endfor %}
    </div>
</div>

<script>
    // Optional: Add a subtle entry animation for the cards
    document.addEventListener('DOMContentLoaded', function() {
        const cards = document.querySelectorAll('.category-card');
        cards.forEach((card, index) => {
            card.style.opacity = '0';
            card.style.transform = 'translateY(20px)';
            setTimeout(() => {
                card.style.transition = 'all 0.6s ease';
                card.style.opacity = '1';
                card.style.transform = 'translateY(0)';
            }, index * 150);
        });
    });
</script>
{% endblock %}
