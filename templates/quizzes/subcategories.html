{% extends 'base.html' %}

{% block content %}
<style>
    .subcategory-card {
        transition: all 0.3s ease;
        border-radius: 20px;
        border-left: 5px solid #6c757d;
    }
    .subcategory-card:hover {
        border-left: 5px solid #0d6efd;
        transform: translateX(10px);
        background-color: rgba(13, 110, 253, 0.02);
    }
    /* AI Mode Styling */
    .ai-active-card {
        border-left: 5px solid #8a2be2 !important; /* Purple for AI */
        background-color: rgba(138, 43, 226, 0.05) !important;
    }
    .ai-active-card:hover {
        border-left: 5px solid #bf40bf !important;
    }
    .form-switch .form-check-input:checked {
        background-color: #8a2be2;
        border-color: #8a2be2;
    }
</style>

<div class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-3">
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb mb-0">
                <li class="breadcrumb-item"><a href="{% url 'quiz_categories' %}" class="text-decoration-none">Categories</a></li>
                <li class="breadcrumb-item active">{{ category.name }}</li>
            </ol>
        </nav>

        <div class="form-check form-switch bg-white p-2 px-4 rounded-pill shadow-sm border d-flex align-items-center">
            <input class="form-check-input me-2" type="checkbox" role="switch" id="aiModeToggle" style="width: 2.5em; height: 1.25em; cursor: pointer;">
            <label class="form-check-label fw-bold text-dark mb-0" for="aiModeToggle" style="cursor: pointer;">
                ✨ AI Quiz Mode
            </label>
        </div>
    </div>

    <h1 class="display-greeting mb-4">Subjects in <span class="text-gradient">{{ category.name }}</span></h1>

    <div class="row g-3">
        {% for sub in subcategories %}
        <div class="col-12">
            <a href="{% url 'quiz_settings' sub.id %}" 
            id="link-{{ sub.id }}" 
            class="subcategory-link text-decoration-none text-dark" 
            data-sub-id="{{ sub.id }}"
            data-standard-url="{% url 'quiz_settings' sub.id %}">
                
                <div id="card-{{ sub.id }}" class="card p-4 shadow-sm subcategory-card d-flex flex-row align-items-center justify-content-between">
                    <div>
                        <h5 class="fw-bold mb-0">{{ sub.name }}</h5>
                        <small class="text-muted mode-text">Standard Mode</small>
                    </div>
                    <i class="bi bi-chevron-right text-primary icon-arrow"></i>
                </div>
            </a>
        </div>
        {% empty %}
        <div class="text-center py-5">
            <p class="text-muted">No subjects found in this category yet.</p>
        </div>
        {% endfor %}
    </div>
</div>


<script>
   document.getElementById('aiModeToggle').addEventListener('change', function() {
    const isAi = this.checked;
    const links = document.querySelectorAll('.subcategory-link');

    links.forEach(link => {
        const baseUrl = link.getAttribute('data-standard-url'); // The settings URL

        if (isAi) {
            // Keep the user going to Settings, but tell Settings it's for AI
            link.href = `${baseUrl}?mode=ai`;
            link.querySelector('.mode-text').innerText = "✨ AI Mode Active";
        } else {
            link.href = baseUrl;
            link.querySelector('.mode-text').innerText = "Standard Mode";
        }
    });
});
</script>

<style>
    .text-purple { color: #8a2be2; }
</style>
{% endblock %}
