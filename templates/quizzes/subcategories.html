{% extends 'base.html' %}

{% block content %}
<style>
    .subcategory-card {
        transition: all 0.3s ease;
        border-radius: 20px;
        border-left: 5px solid #6c757d; /* Neutral until hover */
    }
    .subcategory-card:hover {
        border-left: 5px solid #0d6efd;
        transform: translateX(10px);
        background-color: rgba(13, 110, 253, 0.02);
    }
</style>

<div class="container py-5">
    <nav aria-label="breadcrumb" class="mb-4">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a href="{% url 'quiz_categories' %}" class="text-decoration-none">Categories</a></li>
            <li class="breadcrumb-item active">{{ category.name }}</li>
        </ol>
    </nav>

    <h1 class="display-greeting mb-4">Subjects in <span class="text-gradient">{{ category.name }}</span></h1>

    <div class="row g-3">
        {% for sub in subcategories %}
        <div class="col-12">
            <a href="{% url 'quiz_settings' sub.id %}" class="text-decoration-none text-dark">
                <div class="card p-4 shadow-sm subcategory-card d-flex flex-row align-items-center justify-content-between">
                    <h5 class="fw-bold mb-0">{{ sub.name }}</h5>
                    <i class="bi bi-chevron-right text-primary"></i>
                </div>
            </a>
        </div>
        {% empty %}
        <div class="text-center py-5">
            <p class="text-muted">No subjects found in this category yet.</p>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
