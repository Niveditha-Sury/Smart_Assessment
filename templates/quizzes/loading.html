{% extends 'base.html' %}
{% block content %}
<div class="container text-center py-5">
    <div class="spinner-border text-primary mb-4" role="status" style="width: 3rem; height: 3rem;"></div>
    <h2 class="fw-bold">Generating Your Smart Quiz...</h2>
    <p class="text-muted" id="status-text">Connecting to AI Engine...</p>
    
    <div class="progress mt-4 mx-auto" style="max-width: 500px; height: 12px; border-radius: 10px;">
        <div id="ai-progress-bar" class="progress-bar progress-bar-striped progress-bar-animated bg-success" style="width: 0%"></div>
    </div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        const bar = document.getElementById('ai-progress-bar');
        const status = document.getElementById('status-text');
        const stages = ["Analyzing topic...", "Drafting questions...", "Verifying answers...", "Finalizing..."];
        let width = 0;

        // 1. Start artificial progress animation
        const interval = setInterval(() => {
            if (width < 90) {
                width += 1;
                bar.style.width = width + "%";
                if (width % 25 === 0) status.innerText = stages[Math.floor(width/25)];
            }
        }, 150);

        // 2. Call the actual backend generation
            fetch("{% url 'process_ai_generation' subcategory.id %}", {
    method: 'GET',
    headers: {
        'X-Requested-With': 'XMLHttpRequest', // Tells Django this is an AJAX call
    }
})
.then(response => {
    if (!response.ok) {
        throw new Error('Network response was not ok');
    }
    return response.json();
})
.then(data => {
    if (data.status === 'success') {
        // 1. Visual confirmation of completion
        width = 100;
        bar.style.width = "100%";
        bar.classList.remove('bg-primary'); // Optional: change color to success
        bar.classList.add('bg-success');
        status.innerText = "Questions Generated Successfully!";

        // 2. Controlled Redirect
        // The 1000ms delay gives the Django session backend 
        // a moment to finalize the DB write on the server.
        setTimeout(() => {
            window.location.href = "{% url 'quiz_play_ai' %}";
        },1500);

    } else {
        // Handle logic errors from the Groq API (e.g., Rate Limits)
        status.innerText = "AI Generation Failed...";
        alert("AI Error: " + (data.message || "Unknown error occurred"));
        window.location.href = "{% url 'subcategories' subcategory.category.id %}";
    }
})
.catch(error => {
    console.error("Fetch Error:", error);
    status.innerText = "Connection Error...";
    alert("Could not connect to the server. Please check your internet.");
    window.location.href = "{% url 'quiz_categories' %}";
});
    });
</script>
{% endblock %}
