{% extends 'base.html' %}

{% block content %}
<style>
    .settings-card { border-radius: 30px; background: #ffffff; border: 1px solid rgba(0,0,0,0.05); }
    .form-label-bold { font-weight: 700; color: #495057; margin-bottom: 10px; }
    .btn-check:checked + .btn-outline-primary {
        background-color: #0d6efd; color: white;
        box-shadow: 0 4px 12px rgba(13, 110, 253, 0.2);
    }
    #timerDurationContainer { transition: all 0.3s ease; }
</style>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card settings-card shadow-lg p-5">
                <div class="text-center mb-4">
                    <h2 class="fw-bold">Quiz <span class="text-gradient">Setup</span></h2>
                    <p class="text-muted">Subject: <strong>{{ subcategory.name }}</strong></p>
                </div>

                <form method="POST">
                    {% csrf_token %}
                    <input type="hidden" name="quiz_mode" value="{{ request.GET.mode|default:'standard' }}">
                    <div class="mb-4">
                        <label class="form-label-bold d-block">Select Difficulty</label>
                        <div class="btn-group w-100" role="group">
                            <input type="radio" class="btn-check" name="difficulty" id="easy" value="Easy" checked>
                            <label class="btn btn-outline-primary rounded-start-pill" for="easy">Easy</label>
                            <input type="radio" class="btn-check" name="difficulty" id="medium" value="Medium">
                            <label class="btn btn-outline-primary" for="medium">Medium</label>
                            <input type="radio" class="btn-check" name="difficulty" id="hard" value="Hard">
                            <label class="btn btn-outline-primary rounded-end-pill" for="hard">Hard</label>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label-bold">Number of Questions</label>
                        <select name="num_questions" class="form-select rounded-pill p-3">
                            <option value="5">5 Questions</option>
                            <option value="10">10 Questions</option>
                            <option value="15">15 Questions</option>
                        </select>
                    </div>

                    <div class="mb-3 d-flex justify-content-between align-items-center bg-light p-3 rounded-4">
                        <label class="form-label-bold mb-0" for="timerToggle">Enable Timer</label>
                        <div class="form-check form-switch">
                            <input class="form-check-input" type="checkbox" name="timer" id="timerToggle" style="transform: scale(1.3);" checked onchange="toggleDuration()">
                        </div>
                    </div>

                    <div id="timerDurationContainer" class="mb-4">
                        <label class="form-label-bold">Select Duration</label>
                        <select name="timer_duration" class="form-select rounded-pill p-3 border-primary text-primary fw-bold">
                            <option value="5">5 Minutes</option>
                            <option value="10">10 Minutes</option>
                            <option value="20">20 Minutes</option>
                            <option value="30">30 Minutes</option>
                        </select>
                    </div>
                    
                    <button type="submit" class="btn-dynamic w-100 py-3 shadow">
                        🚀 Start Quiz Now
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
function toggleDuration() {
    const container = document.getElementById('timerDurationContainer');
    const toggle = document.getElementById('timerToggle');
    container.style.display = toggle.checked ? 'block' : 'none';
}
// Initialize state on load
document.addEventListener('DOMContentLoaded', toggleDuration);
</script>
{% endblock %}
