{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="container mt-5 mb-5">
    <div class="row justify-content-center">
        <div class="col-md-4">
            <div class="card shadow-sm border-0 text-center p-4 h-100">
                <div class="position-relative d-inline-block mx-auto">
                    <img src="{{ user.profile.profile_pic.url }}" 
                         class="rounded-circle shadow" 
                         style="width: 140px; height: 140px; object-fit: cover; border: 4px solid #f8f9fa;">
                    <span class="position-absolute bottom-0 end-0 badge rounded-pill bg-success p-2" title="Online">
                        <span class="visually-hidden">Active</span>
                    </span>
                </div>
                <h3 class="mt-3 fw-bold mb-0">{{ user.username }}</h3>
                <p class="text-muted small mb-3">{{ user.email }}</p>
                <hr>
                <div class="d-flex justify-content-around">
                    <div>
                        <h6 class="mb-0">🔥 Streak</h6>
                        <span class="badge bg-light text-dark">{{ user.profile.streak }} Days</span>
                    </div>
                    <div>
                        <h6 class="mb-0">📍 Location</h6>
                        <span class="badge bg-light text-dark">{{ user.profile.location|default:"Global" }}</span>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-md-8">
            <div class="card shadow-sm border-0 p-4">
                <div class="d-flex align-items-center mb-4">
                    <div class="bg-primary text-white rounded p-2 me-3">
                        <i class="bi bi-person-gear fs-4"></i> </div>
                    <h4 class="mb-0 fw-bold">Account Settings</h4>
                </div>

                <form method="POST" enctype="multipart/form-data">
                    {% csrf_token %}
                    
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-semibold">First Name</label>
                            <input type="text" name="first_name" class="form-control bg-light" value="{{ user.first_name }}" placeholder="Your first name">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-semibold">Email Address <span class="text-danger">*</span></label>
                            <input type="email" name="email" class="form-control bg-light" value="{{ user.email }}" required placeholder="email@example.com">
                            <div class="form-text text-muted">Required for account security.</div>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Bio</label>
                        <textarea name="bio" rows="4" class="form-control bg-light" placeholder="Tell us about yourself...">{{ user.profile.bio }}</textarea>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Profile Location</label>
                        <input type="text" name="location" class="form-control bg-light" value="{{ user.profile.location }}" placeholder="e.g. New York, USA">
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-semibold">Update Profile Picture</label>
                        <input type="file" name="profile_pic" class="form-control bg-light">
                    </div>

                    <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                        <a href="{% url 'dashboard' %}" class="btn btn-light px-4">Cancel</a>
                        <button type="submit" class="btn btn-primary px-5 shadow-sm">
                            Save Profile
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<style>
    /* Theme enhancements */
    body { background-color: #f4f7f6; }
    .card { border-radius: 12px; }
    .form-control:focus {
        background-color: #fff;
        border-color: #0d6efd;
        box-shadow: 0 0 0 0.25rem rgba(13, 110, 253, 0.1);
    }
    .btn-primary {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        border: none;
    }
    .btn-primary:hover {
        opacity: 0.9;
        transform: translateY(-1px);
    }
</style>
{% endblock %}
